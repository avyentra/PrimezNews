name: Publish readable news URLs
on:
  push:
    branches: [main]
    paths:
      - 'news.html'
      - 'assets/js/news-seed.js'
      - 'scripts/build_news_pages.py'
      - '.github/workflows/news-pages.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: news-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build_news_pages.py
      - name: Commit published pages only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/ 404.html assets/js/news-routes.js data/news-pages.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh published headline pages'
            git pull --rebase origin main
            git push origin HEAD:main
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
          fi
