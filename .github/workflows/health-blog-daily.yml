name: Health and beauty editorial queue
on:
  schedule:
    - cron: '40 4 * * *'
    - cron: '40 10 * * *'
    - cron: '25 * * * *'
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/health-blog-daily.yml']
  workflow_dispatch:
    inputs:
      slot:
        type: choice
        options: [morning, evening, export]
        default: morning
permissions:
  contents: read
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
jobs:
  draft:
    if: github.ref == 'refs/heads/main' && github.event.schedule != '*/15 * * * *' && inputs.slot != 'export'
    runs-on: ubuntu-latest
    concurrency: health-blog-private-drafts
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Save private dashboard drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_BLOGS || secrets.GEMINI_API_KEY }}
          BLOG_BACKUP_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_SLOT: ${{ inputs.slot }}
        run: |
          if [ -z "$BLOG_SLOT" ]; then
            now=$(TZ=Asia/Kolkata date +%H%M)
            if [[ "$now" < "1010" ]]; then
              export BLOG_DAY=$(TZ=Asia/Kolkata date -d yesterday +%F) BLOG_SLOT=evening
            elif [[ "$now" < "1610" ]]; then export BLOG_SLOT=morning; else export BLOG_SLOT=evening; fi
          fi
          python3 scripts/generate_health_blogs.py
  publish:
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '*/15 * * * *' || inputs.slot == 'export')
    concurrency: health-blog-approved-export
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/generate_health_blogs.py export
      - id: changes
        run: |
          if git diff --quiet -- data/health-blog.json; then echo 'ready=false' >> "$GITHUB_OUTPUT"; else echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - run: python3 -m pip install 'Pillow>=11,<14'
        if: steps.changes.outputs.ready == 'true'
      - name: Build blog pages and check them
        if: steps.changes.outputs.ready == 'true'
        run: |
          python scripts/build_health_blog.py
          python -m unittest tests.test_health_blog
      - name: Commit blogs
        if: steps.changes.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/health-blog.json health-blog media/share health-beauty.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Add daily health blogs'
            git pull --rebase origin main
            git push origin HEAD:main
            deployed=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq .commit)
            if [ "$deployed" != "$(git rev-parse HEAD)" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
            fi
          else
            echo "Nothing new to commit."
          fi
