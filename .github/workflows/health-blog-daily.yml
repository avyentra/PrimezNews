name: Daily health blogs
# Writes 4-5 new Punjabi + Hindi + English health & beauty blogs every day (06:30 IST), rotating over 10 topics,
# rebuilds /health-blog/ and commits the result to main.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      per_day:
        description: 'Blogs to have for today (1-10). Empty = 4 or 5 automatically'
        required: false
        default: ''
      draft:
        description: 'Draft only: save to data/health-blog-drafts.json instead of publishing'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: health-blog-daily
  cancel-in-progress: false
jobs:
  blogs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<14'
      - name: Write today's blogs with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEALTH_BLOGS_PER_DAY: ${{ inputs.per_day || vars.HEALTH_BLOGS_PER_DAY || '' }}
          HEALTH_BLOG_DRAFT: ${{ (inputs.draft || vars.HEALTH_BLOG_DRAFT == 'true') && 'true' || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is missing."
            exit 1
          fi
          python scripts/generate_health_blogs.py
      - name: Build blog pages and check them
        run: |
          python scripts/build_health_blog.py
          python -m unittest tests.test_health_blog
      - name: Commit blogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/health-blog.json health-blog media/share health-beauty.html sitemap.xml
          git add data/health-blog-drafts.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Add daily health blogs'
            git pull --rebase origin main
            git push origin HEAD:main
            deployed=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq .commit)
            if [ "$deployed" != "$(git rev-parse HEAD)" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
            fi
          else
            echo "Nothing new to commit."
          fi
