<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Primez · Newsroom</title><link rel="stylesheet" href="assets/css/cloud-newsroom.css"></head><body><header><a href="index.html"><img src="assets/newsroom-logo.png" alt="Primez News"></a><span>Newsroom</span><span class="spacer"></span><a href="news.html" target="_blank" rel="noopener">View live stories ↗</a><button class="btn" id="logout">Sign out</button></header><main><p id="accessMessage" class="notice" role="status">Checking newsroom access…</p><div id="workspace" hidden><h1>Story workspace</h1><p class="muted" id="signedInAs"></p><nav class="actions"><button type="button" class="btn primary" id="storiesTab">Stories</button><button type="button" class="btn" id="adsTab">Advertisements</button></nav><br><section id="storiesPanel" class="grid"><aside class="card"><h2>Recent stories</h2><button class="btn primary" id="newStory">＋ New story</button><label class="field">Search stories<input id="storySearch" type="search" placeholder="Search headline"></label><div class="story-list" id="storyList"></div><button class="btn" id="importDrafts">Import this browser's drafts</button><button class="btn" id="exportDrafts">Export backup</button></aside><div><form id="cloudStoryForm" class="card"><h2 id="editorHeading">New story</h2><p class="muted" id="editorStatus">Draft</p><label class="field">Hindi headline<input id="title" maxlength="500" required></label><label class="field">English headline<input id="en" maxlength="500" required></label><label class="field">Summary<textarea id="summary" maxlength="3000" rows="3" required></textarea></label><fieldset><legend>Categories</legend><p class="muted">Select categories, then choose the primary category below.</p><div class="categories" id="categories"></div></fieldset><label class="field">Primary category<select id="primaryCategory" required></select></label><div class="row"><label class="field">District<select id="district"></select></label><label class="field">Author<input id="author" maxlength="200" placeholder="News desk"></label></div><label class="field">Main image <small>JPG, PNG or WebP · Max 1 MB · Public news assets only</small><input type="file" id="storyFile" accept="image/jpeg,image/png,image/webp"></label><img id="storyPreview" class="image-preview" alt="Story image preview" hidden><button type="button" id="removeImage" class="btn danger">Remove image</button><label class="field">Article body<textarea id="body" maxlength="100000" rows="12" placeholder="Write your article. Separate paragraphs with blank lines."></textarea></label><fieldset><legend>Publishing</legend><label><input type="radio" name="mode" value="published" checked> Publish now</label> <label><input type="radio" name="mode" value="scheduled"> Schedule</label><label class="field" id="scheduleField" hidden>Publish date and time (IST)<input type="datetime-local" id="publishAt"><small>Asia/Kolkata · Visitors can access the story when this time is reached.</small></label></fieldset></form><div class="bar"><p id="storyFeedback" class="feedback" role="status"></p><div class="actions"><button type="submit" form="cloudStoryForm" class="btn" id="saveDraft">Save draft</button><button class="btn" id="preview">Preview</button><button class="btn primary" id="publish">Publish now</button><button class="btn danger" id="deleteStory">Delete story</button></div></div></div></section><section id="adsPanel" class="card" hidden><h2>Advertisement placements</h2><form id="cloudAdForm"><label class="field">Placement<select id="adSlot"></select></label><img id="adPreview" alt="Ad image" class="image-preview" hidden><label class="field">Creative image<input id="adFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="field">Destination URL<input id="adUrl" type="url" placeholder="https://"></label><label><input type="checkbox" id="adEnabled" checked> Enabled</label><br><br><button class="btn primary" id="saveAd">Save advertisement</button><p id="adFeedback" role="status"></p></form></section></div></main><dialog id="previewDialog"><button class="btn" id="closePreview">Close preview</button><article id="previewBody" class="article"></article></dialog><script src="assets/js/backend-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script><script src="assets/js/newsroom-api.js"></script><script src="assets/js/cloud-dashboard.js"></script></body></html>
