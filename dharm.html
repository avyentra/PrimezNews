<script>
fetch('stories.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(list){
  var items=list.filter(function(s){return s.category==='Faith'});
  var el=document.getElementById('faithPage');
  if(!items.length)return;
  el.innerHTML=items.map(function(s){
    return '<a class="faith-card" href="home-v2.html?story='+encodeURIComponent(s.id)+'"><img loading="lazy" decoding="async" src="assets/'+s.image+'.webp" alt="'+String(s.title).replace(/"/g,'&quot;')+'" width="800" height="450"><div><span class="faith-tag">'+s.district+'</span><h2>'+s.title+'</h2><small>'+s.minutes+' मिनट पढ़ें</small></div></a>';
  }).join('');
}).catch(function(){});
</script>
