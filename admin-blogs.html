<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Health &amp; Beauty blogs | PrimezNews Newsroom</title>
  <link rel="stylesheet" href="assets/css/admin-dashboard.css">
  <link rel="stylesheet" href="assets/css/blog-editor.css?v=editor-tabs2">
</head>
<body>
  <div class="ad-app">
    <aside class="ad-side" id="blogSidebar"><a class="ad-logo" href="./"><img src="assets/images/newsroom-logo.webp" width="1000" height="334" fetchpriority="high" decoding="async" alt="Primez News"></a><p class="ad-tag">Newsroom</p><nav class="ad-nav" aria-label="Newsroom"><a href="admin.html?section=home"><i class="ic ic-grid"></i>My dashboard</a><a href="admin.html?section=new"><i class="ic ic-plus"></i>New story</a><a href="admin.html?section=recent"><i class="ic ic-list"></i>Recent news<em class="ad-count" id="recentCount" hidden></em></a><a href="admin.html?section=drafts"><i class="ic ic-edit"></i>Draft news<em class="ad-count" id="draftCount" hidden></em></a><a href="admin-blogs.html" class="active" aria-current="page" id="openHealthReviews"><i class="ic ic-edit"></i>Health &amp; Beauty blogs</a><a href="admin-citizen.html"><i class="ic ic-list"></i>Citizen Stories</a><a href="admin.html?section=ads"><i class="ic ic-ad"></i>Advertisements</a><a id="reviewJournalists" hidden href="join-newsroom#review"><i class="ic ic-users"></i>Journalist applications</a><a href="admin.html?section=settings"><i class="ic ic-gear"></i>Profile settings</a><a href="news/" target="_blank" rel="noopener"><i class="ic ic-globe"></i>View live stories ↗</a></nav><div class="ad-profile"><button type="button" class="ad-gear" id="openSettings" onclick="location.href='admin.html?section=settings'" aria-label="Profile settings" title="Profile settings"><i class="ic ic-gear"></i></button><span class="user-chip" id="userChip" hidden><b id="userInitials"></b><span><strong id="userName"></strong><small id="userEmail"></small></span></span><button class="btn" id="logout"><i class="ic ic-out"></i>Sign out</button></div></aside>
    <main class="ad-main" id="healthReviews">
      <header class="ad-top">
        <button class="btn ad-menu" type="button" id="blogMenu" aria-label="Toggle newsroom menu" aria-controls="blogSidebar" aria-expanded="false">Menu</button>
        <h1>Health &amp; Beauty blogs</h1>
      </header>
      <section class="blog-workspace" aria-label="Blog library">
        <nav class="blog-tabs" aria-label="Blog filter">
          <button class="btn" data-filter="all">All Blogs</button>
          <button class="btn" data-filter="draft">Drafts</button>
          <label>Language <select id="healthReviewLanguage"><option value="en">English</option><option value="pa">ਪੰਜਾਬੀ</option><option value="hi">हिन्दी</option></select></label>
        </nav>
        <p id="healthReviewMessage" role="status">Loading blogs…</p>
        <div id="healthReviewList"></div>
      </section>
    </main>
  </div>
  <script src="assets/js/backend-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script src="assets/js/newsroom-api.js"></script>
  <script src="assets/js/health-blog-review.js?v=editor-tabs2"></script>
<script>document.getElementById('logout').addEventListener('click',async function(){this.disabled=true;try{await PrimezAPI.logout();location.href='admin.html';}catch(e){this.disabled=false;alert('Sign out failed. Please retry.');}});</script></body>
</html>
