<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Citizen Stories | PrimezNews Newsroom</title>
  <link rel="stylesheet" href="assets/css/admin-dashboard.css">
  <link rel="stylesheet" href="assets/css/blog-editor.css?v=editor-tabs2">
<style>.citizen-body{padding:20px;color:#17243a}.citizen-body article{background:#fff;border:1px solid #dce3ed!important;border-radius:12px;padding:20px!important}.citizen-body article p{margin:0;padding:8px 0;white-space:pre-wrap;border-bottom:1px solid #edf0f5}.citizen-body article p:first-child{font-weight:700;font-size:18px}.citizen-body article p:nth-child(9){background:#f5f7fb;padding:14px;border-radius:8px}.citizen-body select,.citizen-body button{font:inherit;padding:9px 14px;border-radius:7px;margin:12px 8px 0 0;border:1px solid #ccd5e3}.citizen-body button{background:#10243e;color:white;cursor:pointer}.citizen-body button:disabled{opacity:.5}@media(max-width:700px){.citizen-body{padding:12px}#blogSidebar.citizen-open{display:flex!important;transform:none!important;visibility:visible!important}}</style></head>
<body>
  <div class="ad-app">
    <aside class="ad-side" id="blogSidebar">
      <a class="ad-logo" href="admin.html"><img src="assets/images/newsroom-logo.webp" alt="PrimezNews"></a>
      <p class="ad-tag">Newsroom</p>
      <nav class="ad-nav" aria-label="Newsroom">
        <a href="admin.html"><i class="ic ic-grid"></i> Newsroom dashboard</a>
        <a href="admin-blogs.html"><i class="ic ic-edit"></i> Health &amp; Beauty blogs</a><a href="admin-citizen.html" aria-current="page"><i class="ic ic-list"></i> Citizen Stories</a>
        <a href="citizen-stories.html"><i class="ic ic-globe"></i> View submission form ↗</a>
      </nav>
    </aside>
    <main class="ad-main" id="citizenReviews">
      <header class="ad-top">
        <button class="btn ad-menu" type="button" id="blogMenu" aria-label="Toggle newsroom menu" aria-controls="blogSidebar" aria-expanded="false">Menu</button>
        <h1>Citizen Stories</h1>
      </header>
      <section class="blog-workspace" aria-label="Citizen story inbox"><div class="blog-tabs"><strong>Editorial inbox</strong></div><div class="citizen-body"><p>Verify evidence and contact the source before publishing through the New story editor. Status changes do not publish articles.</p><p id="status" role="status">Loading submissions…</p><div id="inbox"></div></div></section>
    </main>
  </div>
  <script src="assets/js/backend-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script src="assets/js/newsroom-api.js"></script>
  <script src="assets/js/admin-citizen.js"></script>
<script>document.getElementById('blogMenu').addEventListener('click',function(){const open=document.getElementById('blogSidebar').classList.toggle('citizen-open');this.setAttribute('aria-expanded',String(open));});</script></body>
</html>
